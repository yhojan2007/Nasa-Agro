services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      CACHE_DIR: /app/data/cache
      NASA_TIMEOUT_SECONDS: "60"
    volumes:
      - ./backend/data/cache:/app/data/cache

  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://api:8000
    depends_on:
      - api
